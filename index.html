<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Perayaan di Dunia GbYoung 💕 — untuk Gabriela</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ CANVAS 3D ============ -->
  <canvas id="app-canvas"></canvas>

  <!-- ============ HUD ============ -->
  <div id="hud">
    <div id="route-status">🏁 Ikuti lintasan menuju FINISH...</div>
    <div id="compass">
      <div id="compass-needle">▲</div>
      <div id="compass-label">U</div>
    </div>
    <div id="speed-hud">
      <div id="speed-label">KECEPATAN</div>
      <div id="speed-bar-track"><div id="speed-bar-fill"></div></div>
    </div>
    <button id="cam-btn" title="Ganti jarak kamera (C)">🎥 <span id="cam-btn-label">Sedang</span></button>
  </div>

  <!-- ============ JOYSTICK ANALOG (mobile/sentuh, tanpa keyboard) ============ -->
  <div id="joystick">
    <div id="joystick-base">
      <div id="joystick-knob"></div>
    </div>
  </div>

  <!-- ============ LOCK SCREEN ============ -->
  <div id="lock-screen">
    <div id="lock-card">
      <div class="lock-emoji">🔒💕</div>
      <h1>Perayaan di Dunia GbYoung</h1>
      <p id="lock-hint">Ganti hint di sini</p>
      <input type="password" id="lock-input" placeholder="Masukkan PIN..." autocomplete="off">
      <div class="lock-btn-row">
        <button id="dodge-btn" type="button" title="Coba klik kalau bisa 😏">Maless Ahh....</button>
        <button id="lock-submit">Buka Gerbang</button>
      </div>
      <p id="lock-error">PIN salah, coba lagi ya 🥺</p>
    </div>
    <div id="lock-success-burst"></div>
  </div>

  <!-- ============ CAKE INTRO OVERLAY ============ -->
  <div id="cake-intro">
    <div id="cake-intro-emoji">🎂</div>
    <div id="cake-intro-confetti"></div>
  </div>

  <!-- ============ SURAT ULANG TAHUN (POPUP SURAT LUCU) ============ -->
  <div id="birthday-screen">
    <div id="birthday-card">
      <div class="birthday-envelope-flap">💌</div>
      <div class="birthday-emoji">🎉🎂🎉</div>
      <h1 id="birthday-title">Selamat Ulang Tahun!</h1>
      <div id="birthday-letter-body"><!-- diisi otomatis dari BIRTHDAY_LETTER_LINES --></div>
      <button id="birthday-close">Lanjut Jalan-jalan</button>
    </div>
  </div>

  <!-- ============ LOADING ============ -->
  <div id="loading-screen">
    <div id="loading-text">Membangun kota kecil... 🏗️</div>
  </div>

  <!-- ===== Three.js r147 — build non-module (global THREE), pinned deliberately.
       Lihat README.md "Log Keputusan Desain" untuk alasan pemilihan versi ini. ===== -->
  <script src="https://unpkg.com/three@0.147.0/build/three.js"></script>
  <script src="assets/photos-embedded.js"></script>
  <script src="script.js"></script>
</body>
</html>
